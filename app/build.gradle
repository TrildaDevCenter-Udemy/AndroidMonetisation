plugins {
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.android.application)
    alias(libs.plugins.org.jetbrains.kotlin.android)
    alias(libs.plugins.parcelize)
    alias(libs.plugins.ksp)
}

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.devtides.androidmonetisation"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 3
        versionName "1.3"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        getByName("release")  {
            isMinifyEnabled = false

            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
            signingConfig = signingConfigs.getByName("debug")
        }
    }

    val javaVersion = JavaVersion.VERSION_17

    compileOptions {
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
    }

    kotlin {
        jvmToolchain(javaVersion.majorVersion.toInt())
    }

    buildFeatures {
        aidl = false
        buildConfig = true
        compose = true
        prefab = false
        renderScript = false
        resValues = true
        shaders = true
        viewBinding = true
        dataBinding = false
    }


    flavorDimensions "pricing"

    productFlavors {
        free {
            dimension "pricing"
            applicationId "com.devtides.androidmonetisation.free"
        }

        paid {
            dimension "pricing"
            applicationId "com.devtides.androidmonetisation.paid"
        }
    }

    packagingOptions.resources {
        // The Rome library JARs embed some internal utils libraries in nested JARs.
        // We don't need them so we exclude them in the final package.
        //excludes += "/*.jar"

        // Multiple dependency bring these files in. Exclude them to enable
        // our test APK to build (has no effect on our AARs)
        excludes.add("/META-INF/AL2.0")
        excludes.add("/META-INF/LGPL2.1")
    }
}

